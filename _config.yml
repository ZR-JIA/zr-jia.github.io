# Site Settings
title: "Zheng Rong JIA"
name: "Zheng Rong JIA"
description: "Independent AI researcher specializing in Clinical AI, deep learning, and data-driven systems."
url: "https://zr-jia.github.io"
baseurl: ""
repository: "ZR-JIA/zr-jia.github.io"

# Reading Files
include:
  - _pages

exclude:
  - assets/slides/

# Publications are dated by conference date, which is in the future for papers
# that are accepted but not yet presented. Without this they would be dropped
# from the build until the conference happens.
future: true

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:name/

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Analytics
google_analytics: "G-NK9PCN4QNX"

# Encoding
encoding: "utf-8"
