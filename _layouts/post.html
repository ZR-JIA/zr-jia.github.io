---
layout: default
---
<div class="container">
  <div class="page-header">
    <div>
      <p class="post-kicker"><a href="/commentary/">Commentary</a></p>
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        <span class="news-date" style="font-size:13px;">{{ page.date | date: "%B %-d, %Y" }}</span>
        {% if page.tags and page.tags.size > 0 %}
          &ensp;·&ensp;
          {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% unless forloop.last %} {% endunless %}{% endfor %}
        {% endif %}
      </p>
    </div>
  </div>
  <article class="post-content">
    {{ content }}
  </article>
  <div class="post-footer">
    <a href="/commentary/" class="post-back"><i class="fas fa-arrow-left"></i> Back to Commentary</a>
  </div>
</div>
