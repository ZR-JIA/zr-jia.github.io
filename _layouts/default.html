<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ page.url | absolute_url }}">
  <meta property="twitter:title" content="{{ page.title | default: site.title }}">
  <meta property="twitter:description" content="{{ page.description | default: site.description }}">
  <meta property="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <!-- Theme init: must run before CSS to avoid flash of unstyled content -->
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}})();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.6/css/academicons.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Zheng Rong JIA",
    "url": "https://zr-jia.github.io",
    "image": "https://zr-jia.github.io/assets/images/avatar.jpg",
    "email": "zhengrong.jia.academic@gmail.com",
    "jobTitle": "AI Researcher",
    "description": "AI researcher specializing in Clinical AI and Deep Learning. First author of a CCAI 2026 paper, published in IEEE Xplore, and of a PRICAI 2026 short paper, accepted.",
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Macau University of Science and Technology"
    },
    "knowsAbout": [
      "Clinical AI",
      "Deep Learning",
      "Transformer",
      "Dual-Tower Transformer",
      "Electronic Health Records",
      "Stroke Mortality Prediction"
    ],
    "sameAs": [
      "https://github.com/ZR-JIA",
      "https://www.linkedin.com/in/zhengrong-jia-866456374",
      "https://orcid.org/0009-0007-8829-6713",
      "https://scholar.google.com/citations?user=juPceOgAAAAJ&hl=en",
      "https://www.researchgate.net/profile/Zhengrong-Jia-2",
      "https://www.webofscience.com/wos/author/record/RFS-2719-2026",
      "https://www.scopus.com/authid/detail.uri?authorId=60820100100",
      "https://ieeexplore.ieee.org/author/737514430667351"
    ]
  }
  </script>

  <!-- Google Analytics (GA4) -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body>

  <a href="#main-content" class="skip-to-content">Skip to content</a>

  {% include navbar.html %}

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
